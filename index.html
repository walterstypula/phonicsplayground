<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phonics Playground</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ MENU ============ -->
<section id="menu" class="screen">
  <div class="topbar">
    <button id="btn-feedback" class="mini feedback" hidden>✉️ Grown-ups: send feedback</button>
  </div>
  <h1 class="logo"><span>Phonics</span> <em>Playground</em></h1>
  <p class="tagline">Listen, look, and play!</p>

  <div class="agebar">
    <span class="agebar-label">How old are you?</span>
    <div id="ages" class="ages"></div>
  </div>

  <p id="level-note" class="level-note"></p>

  <div id="cards" class="cards"></div>

  <footer class="grownups">
    <button id="btn-sound" class="mini" aria-pressed="true">🔊 Sound: on</button>
    <span class="hint">Tip: headphones help a lot. Works offline.</span>
  </footer>
</section>

<!-- ============ PLAY ============ -->
<section id="play" class="screen hidden">
  <header id="hud">
    <button id="btn-back" class="hud-btn">◀ Menu</button>

    <div id="prompt" class="prompt">
      <button id="btn-say" class="say" title="Say it again" aria-label="Say it again"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <span id="prompt-text">Listen…</span>
      <button id="btn-peek" class="peek hidden" title="Show the word">👀</button>
    </div>

    <div class="hud-right">
      <button id="btn-feedback-play" class="hud-btn feedback-hud" title="Feedback (for grown-ups)" aria-label="Send feedback (for grown-ups)" hidden>✉️</button>
      <span id="progress" class="progress">0 / 0</span>
      <span id="stars" class="starcount">⭐ 0</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="canvas" width="1000" height="640"></canvas>
    <p class="rotate-hint">&#8635; Turn your phone sideways for bigger words</p>

    <div id="results" class="results hidden">
      <div class="results-card">
        <h2 id="results-title">Great job!</h2>
        <div id="results-stars" class="results-stars"></div>
        <p id="results-sub"></p>
        <div class="results-btns">
          <button id="btn-again" class="big">Play again</button>
          <button id="btn-menu" class="big ghost">Another game</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ GROWN-UPS CHECK ============
     Stands between a child and anything that leaves the game. The question is written
     out in words, so a child who cannot yet read them cannot answer it. -->
<div id="gate" class="gate hidden" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <form id="gate-form" class="results-card gate-card" autocomplete="off">
    <h2 id="gate-title">For grown-ups</h2>
    <p class="gate-why">To send feedback, please answer:</p>
    <label id="gate-q" class="gate-q" for="gate-answer">What is fourteen times three?</label>
    <input id="gate-answer" class="gate-answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-describedby="gate-msg">
    <p id="gate-msg" class="gate-msg" aria-live="polite"></p>
    <div class="results-btns">
      <button type="button" id="gate-cancel" class="big ghost">Cancel</button>
      <button type="submit" class="big">Continue</button>
    </div>
  </form>
</div>

<script src="js/words.js"></script>
<script src="audio/clips.js"></script>
<script src="stories/stories.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/rules.js"></script>
<script src="js/strokes.js"></script>
<script src="js/games/wordhunt.js"></script>
<script src="js/games/claw.js"></script>
<script src="js/games/bubbles.js"></script>
<script src="js/games/builder.js"></script>
<script src="js/games/rhyme.js"></script>
<script src="js/games/fishing.js"></script>
<script src="js/games/octopus.js"></script>
<script src="js/games/hungry.js"></script>
<script src="js/games/lava.js"></script>
<script src="js/games/pilot.js"></script>
<script src="js/games/soccer.js"></script>
<script src="js/games/giant.js"></script>

<script src="js/games/practice.js"></script>
<script src="js/main.js"></script>
</body>
</html>
